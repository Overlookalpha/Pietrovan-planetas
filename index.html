<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Pietrovan e os Planetas</title>

 <meta name="theme-color" content="#0E1330">

<link rel="manifest" href="./manifest.json">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pietrovan">

<link rel="apple-touch-icon" href="./icons/icon-192.png">
 
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;700;800&display=swap" />
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; height: 100dvh;
    background: #0E1330; color: #F5F3FF; font-family: 'Nunito', sans-serif;
    overflow: hidden; overscroll-behavior: none; touch-action: none;
    position: fixed; inset: 0;
  }
  #root { position: fixed; inset: 0; height: 100dvh; display: flex; flex-direction: column; }

  /* ---- MENU ---- */
  #menu { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; overflow-y: auto; }
  #menu h1 { font-family: 'Fredoka', sans-serif; color: #FFB648; font-size: clamp(22px, 5vw, 34px); margin: 0 0 4px 0; text-align: center; }
  #menu p.sub { color: #B7BEE8; font-size: 14px; margin: 0 0 22px 0; text-align: center; }
  #planetGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 14px; width: 100%; max-width: 720px; }
  .planetCard {
    border: none; border-radius: 16px; padding: 16px 10px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    color: #F5F3FF; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 13px;
    box-shadow: 0 6px 14px rgba(0,0,0,0.35); position: relative;
  }
  .planetCard .num { position: absolute; top: 8px; left: 10px; font-size: 11px; opacity: 0.7; }
  .planetCard .dot { width: 46px; height: 46px; border-radius: 50%; }
  .planetCard .done { position: absolute; top: 8px; right: 10px; font-size: 14px; }
  .planetCard.locked { opacity: 0.4; filter: grayscale(0.6); cursor: not-allowed; }
  .planetCard .lock { font-size: 20px; }

  #levelIntro {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    pointer-events: none; z-index: 8; opacity: 0; transition: opacity 0.4s ease;
  }
  #levelIntro.show { opacity: 1; }
  #levelIntro .txt {
    font-family: 'Fredoka', sans-serif; font-size: clamp(26px, 7vw, 44px); color: #FFB648;
    text-shadow: 0 4px 14px rgba(0,0,0,0.65); text-align: center; padding: 0 20px;
  }

  /* ---- PLANET INTRO (imagem + curiosidades narradas) ---- */
  #planetIntro {
    display: none; position: fixed; inset: 0; flex-direction: column; align-items: center;
    justify-content: flex-start; padding: 26px 20px 20px 20px; overflow-y: auto; z-index: 20;
  }
  #introSvgWrap { width: min(220px, 55vw); margin-bottom: 12px; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.4)); }
  #introSvgWrap svg { width: 100%; height: auto; display: block; }
  #introName { font-family: 'Fredoka', sans-serif; font-size: clamp(22px, 6vw, 30px); margin: 0 0 16px 0; text-align: center; }
  #introFacts { max-width: 420px; width: 100%; margin-bottom: 20px; }
  .factLine {
    background: rgba(14,19,48,0.35); border-radius: 12px; padding: 10px 14px; margin: 0 0 10px 0;
    font-size: 14px; font-weight: 700; color: #E8E6FF; transition: all 0.25s ease; opacity: 0.6;
  }
  .factLine.active { background: rgba(255,255,255,0.92); color: #171B3D; opacity: 1; transform: scale(1.03); }

  /* ---- GAME ---- */
  #game { position: fixed; inset: 0; display: none; flex-direction: column; }
  #gameCanvasWrap { flex: 1; position: relative; overflow: hidden; }
  #gameSvg { width: 100%; height: 100%; display: block; }
  #hud {
    position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between;
    align-items: center; padding: 10px 14px; pointer-events: none; z-index: 5;
  }
  #hud .left, #hud .right { display: flex; align-items: center; gap: 10px; pointer-events: auto; }
  .hudBtn {
    border: none; background: rgba(14,19,48,0.75); color: #F5F3FF; border-radius: 10px;
    width: 34px; height: 34px; font-size: 15px; cursor: pointer; display:flex; align-items:center; justify-content:center;
  }
  .hudChip { background: rgba(14,19,48,0.6); border-radius: 10px; padding: 5px 10px; font-size: 13px; font-weight: 800; }
  #factBubble {
    position: absolute; left: 50%; bottom: 100px; transform: translateX(-50%); max-width: 84%;
    background: #F5F3FF; color: #171B3D; border-radius: 12px; padding: 10px 14px; font-size: 13px;
    font-weight: 700; box-shadow: 0 6px 16px rgba(0,0,0,0.4); display: none; z-index: 5; text-align:center;
  }
  #overlay {
    position: absolute; inset: 0; background: rgba(14,19,48,0.93); display: none; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding: 24px; z-index: 10;
  }
  #overlay h2 { font-family: 'Fredoka', sans-serif; margin: 6px 0; font-size: 26px; }
  #overlay p { color: #B7BEE8; font-size: 14px; margin: 0 0 18px 0; max-width: 340px; }
  .bigBtn {
    padding: 12px 22px; border-radius: 12px; border: none; font-family: 'Fredoka', sans-serif;
    font-weight: 700; font-size: 15px; cursor: pointer; margin: 5px;
  }
  .primaryBtn { background: linear-gradient(90deg, #FFB648, #FF6FA5); color: #0E1330; }
  .secondaryBtn { background: rgba(255,255,255,0.12); color: #F5F3FF; }

  <meta name="theme-color" content="#0E1330">

<link rel="manifest" href="./manifest.json">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pietrovan">

<link rel="apple-touch-icon" href="./icons/icon-192.png">
 
  .ctrlGroup { display: flex; align-items: flex-end; gap: 12px; }
 .movementControls {
  gap: 26px;
}
 .actionControls {
  gap: 22px;
}
  .ctrlBtn {
    position: relative; border: none; background: rgba(23,27,61,0.85); color: #F5F3FF;
    display: flex; align-items: center; justify-content: center; touch-action: none; user-select: none;
    border-radius: 18px; box-shadow: 0 4px 10px rgba(0,0,0,0.35); flex-shrink: 0;
  }
  .shootBtn { background: rgba(255,182,72,0.28); }
  .jumpBtn { background: linear-gradient(135deg, #FFB648, #FF6FA5); color: #0E1330; font-weight: 800; }
</style>
</head>
<body>

<div id="root">

  <div id="menu">
    <h1>🚀 Pietrovan e os Planetas</h1>
    <p class="sub">Escolha um planeta pra explorar</p>
    <div id="planetGrid"></div>
  </div>

  <div id="planetIntro">
    <div id="introSvgWrap"></div>
    <h2 id="introName"></h2>
    <div id="introFacts"></div>
    <button class="bigBtn primaryBtn" id="introSkip">Jogar agora ▶</button>
  </div>

  <div id="game">
    <div id="gameCanvasWrap">
      <svg id="gameSvg" xmlns="http://www.w3.org/2000/svg">
        <g id="staticLayer"></g>
        <g id="dynamicLayer"></g>
      </svg>
      <div id="hud">
        <div class="left">
          <button class="hudBtn" id="menuBtn">☰</button>
          <span class="hudChip" id="titleChip">Mercúrio</span>
        </div>
        <div class="right">
          <button class="hudBtn" id="fsBtn">⛶</button>
          <button class="hudBtn" id="audioBtn">🔇</button>
          <span class="hudChip" id="crystalChip">💎 0/0</span>
          <span class="hudChip" id="livesChip">❤️❤️❤️</span>
        </div>
      </div>
      <div id="factBubble"></div>
      <div id="levelIntro"><div class="txt" id="levelIntroTxt"></div></div>
      <div id="overlay">
        <div id="overlayIcon" style="font-size:38px;">🚀</div>
        <h2 id="overlayTitle">Fase completa!</h2>
        <p id="overlayText">Você aprendeu tudo!</p>
        <div>
          <button class="bigBtn primaryBtn" id="overlayPrimary">Continuar</button>
          <button class="bigBtn secondaryBtn" id="overlaySecondary">Escolher planeta</button>
        </div>
      </div>
    </div>

    <div id="controls">
     <div class="ctrlGroup movementControls">
  <button
    class="ctrlBtn"
    id="btnLeft"
    style="width:86px; height:86px; font-size:32px;"
  >
    ◀️
  </button>

  <button
    class="ctrlBtn"
    id="btnRight"
    style="width:86px; height:86px; font-size:32px;"
  >
    ▶️
  </button>
</div>
     <div class="ctrlGroup actionControls">

  <button
    class="ctrlBtn shootBtn"
    id="btnShoot"
    style="width:86px; height:86px; font-size:30px;"
  >
    🔫
  </button>

  <button
    class="ctrlBtn jumpBtn"
    id="btnJump"
    style="width:108px; height:108px; font-size:17px;"
  >
    PULAR
  </button>

</div>
    </div>
  </div>

</div>

<script>
(function () {

      giant: { primary: "#C9D93A", secondary: "#8A9E1E", dark: "#2E3A0E", spike: "#FFF3A0" },
      dragon: { body: "#E8C15A", dark: "#B08A2E", darker: "#4A3410", wingBack: "#F0D888", wingFront: "#FFE9B0", glow: "#FFF3C4" },
      facts: [

      ],
      signFacts: [
        "Vênus gira ao contrário dos outros planetas, de trás pra frente!",
        "A pressão do ar em Vênus é tão forte que esmagaria uma nave comum.",
        "Vênus é o segundo planeta mais próximo do Sol e brilha bastante no céu."
      ]
    },
    {
      id: "terra", name: "Terra", num: 3,
      skyTop: "#1B3A6B", skyMid: "#4A8FD9", skyBot: "#8FD9C4",
      ground: "#3E7A3A", crater: "#2E5A2A", sun: "#FFF3B0", accent: "#5FA8FF",
      giant: { primary: "#3EA85A", secondary: "#2A7A3E", dark: "#123018", spike: "#8FD9C4" },
      dragon: { body: "#2E8FD9", dark: "#1E5FA8", darker: "#0E2A4A", wingBack: "#5CC9E8", wingFront: "#7CFFB2", glow: "#C4FFE0" },
      facts: [
        "A Terra é o único planeta que conhecemos com vida!",

      ],
      signFacts: [

      ]
    },
    {
      id: "marte", name: "Marte", num: 4,
      skyTop: "#3A1410", skyMid: "#8A3A22", skyBot: "#D9744A",
      ground: "#8A4A2A", crater: "#5A2E18", sun: "#FFB870", accent: "#FF7A4A",
      giant: { primary: "#D9744A", secondary: "#8A3A22", dark: "#3A1410", spike: "#FFD9A0" },

        "Marte é conhecido como planeta vermelho por causa do ferro no solo.",

      ],
      signFacts: [
        "Marte tem duas luas pequenas, chamadas Fobos e Deimos.",
        "Já foram enviados vários robôs pra explorar a superfície de Marte.",
        "Marte tem estações do ano, parecido com a Terra, só que mais longas."
      ]
    },
    {
      id: "jupiter", name: "Júpiter", num: 5,
      skyTop: "#4A2E14", skyMid: "#A9702E", skyBot: "#D9B078",
      ground: "#8A6440", crater: "#5A3E22", sun: "#FFE0A0", accent: "#E8A24C",
      giant: { primary: "#E8A24C", secondary: "#A9702E", dark: "#3A2410", spike: "#FFF3D0" },
      dragon: { body: "#D97A2E", dark: "#8A4E1A", darker: "#3A2410", wingBack: "#F0B058", wingFront: "#FFD9A0", glow: "#FFF3D0" },
      facts: [
        "Júpiter é o maior planeta do Sistema Solar, gigante mesmo!",
        "A Grande Mancha Vermelha de Júpiter é uma tempestade gigante.",
        "Júpiter tem mais de noventa luas conhecidas até hoje!"
      ],
      signFacts: [
        "Júpiter é um planeta gasoso, não tem uma superfície sólida pra pisar.",
        "Júpiter gira tão rápido que um dia lá dura menos de 10 horas.",
        "A força de gravidade de Júpiter é a maior entre todos os planetas."
      ]
    },
    {
      id: "saturno", name: "Saturno", num: 6,
      skyTop: "#3A2E0E", skyMid: "#B0902E", skyBot: "#E8CE8A",
      ground: "#9A7A3E", crater: "#6A5024", sun: "#FFEFC0", accent: "#F0C864",
      giant: { primary: "#F0C864", secondary: "#B0902E", dark: "#3A2E0E", spike: "#FFF3C4" },
      dragon: { body: "#E8CE8A", dark: "#B0902E", darker: "#4A3E14", wingBack: "#F5E0A8", wingFront: "#FFF3C4", glow: "#FFFBE0" },
      facts: [
        "Saturno é famoso pelos anéis brilhantes feitos de gelo e rocha.",

      ],
      signFacts: [

        "Saturno também é um planeta gasoso, bem parecido com Júpiter.",

      ]
    },
    {
      id: "urano", name: "Urano", num: 7,
      skyTop: "#0E2E3A", skyMid: "#2E7A8A", skyBot: "#8ADBD9",
      ground: "#3E8A8A", crater: "#2A5A5A", sun: "#C0FFF5", accent: "#4CD9C0",
      giant: { primary: "#4CD9C0", secondary: "#2E7A8A", dark: "#0E2E3A", spike: "#C0FFF5" },
      dragon: { body: "#2E9AA8", dark: "#0E2E3A", darker: "#081A22", wingBack: "#6CE0D9", wingFront: "#C0FFF5", glow: "#E0FFFB" },
      facts: [
        "Urano gira quase deitado de lado, diferente dos outros planetas.",
        "Urano é azul-esverdeado por causa do gás metano na atmosfera.",
        "Em Urano, cada polo passa 42 anos seguidos sem ver a luz do Sol."
      ],
      signFacts: [
        "Urano também tem anéis, só que bem mais fracos que os de Saturno.",
        "Urano foi o primeiro planeta descoberto usando um telescópio.",
        "A atmosfera de Urano é uma das mais frias do Sistema Solar."
      ]
    },
    {
      id: "netuno", name: "Netuno", num: 8,
      skyTop: "#0A1440", skyMid: "#1E3A8A", skyBot: "#4A6FD9",
      ground: "#2A3E7A", crater: "#1A2A5A", sun: "#B0C8FF", accent: "#8C6FFF",
      giant: { primary: "#4A6FD9", secondary: "#1E3A8A", dark: "#0A1440", spike: "#8C6FFF" },
      dragon: { body: "#1E3A8A", dark: "#0A1440", darker: "#050A28", wingBack: "#5A4ED9", wingFront: "#8C6FFF", glow: "#C4B8FF" },
      facts: [
        "Netuno é o planeta mais distante do Sol no Sistema Solar.",
        "Os ventos de Netuno são os mais fortes, passam de 2000 km/h!",
        "Netuno leva 165 anos terrestres pra completar uma volta no Sol."
      ],
      signFacts: [
        "Netuno foi descoberto por cálculos matemáticos antes de ser visto.",
        "Netuno tem uma lua chamada Tritão que orbita ao contrário.",
        "Netuno é tão distante que a luz do Sol demora horas pra chegar lá."
      ]
    }
  ];

  var SUIT = "#5FA8FF";
  var SKIN = "#FFDCB5";
  var UNLOCK_KEY = "pietrovan_unlocked";

  function getUnlockedCount() {
    try { return parseInt(localStorage.getItem(UNLOCK_KEY) || "1", 10); } catch (e) { return 1; }
  }
  function setUnlockedCount(n) {
    try { localStorage.setItem(UNLOCK_KEY, String(n)); } catch (e) {}
  }
  function unlockNext(planetIndex) {
    var unlocked = getUnlockedCount();
    if (planetIndex + 2 > unlocked) setUnlockedCount(planetIndex + 2);
  }

  function announceLevel(planet) {
    var el = document.getElementById("levelIntro");
    document.getElementById("levelIntroTxt").textContent = "Fase " + planet.num + " · " + planet.name;
    el.classList.add("show");
    setTimeout(function () { el.classList.remove("show"); }, 1700);
  }

  function selectPlanet(index) {
    var p = PLANETS[index];
    document.getElementById("menu").style.display = "none";
    var introEl = document.getElementById("planetIntro");
    introEl.style.display = "flex";
    introEl.style.background = "linear-gradient(160deg, " + p.skyMid + ", " + p.skyTop + ")";
    document.getElementById("introSvgWrap").innerHTML = planetIllustration(p);
    document.getElementById("introName").textContent = p.num + ". " + p.name;
    document.getElementById("introFacts").innerHTML = p.facts
      .map(function (f, i) { return '<p class="factLine" id="factLine' + i + '">' + f + '</p>'; })
      .join("");

    if (!audioOn) {
      initAudio();
      audioOn = true;
      document.getElementById("audioBtn").textContent = "🔊";
    }

    var cancelled = false;
    var goPlay = function () {
      if (cancelled) return;
      cancelled = true;
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      introEl.style.display = "none";
      startLevel(index);
    };
    document.getElementById("introSkip").onclick = goPlay;

    var queue = ["Planeta " + p.num + ". " + p.name + "."].concat(p.facts);
    var qi = -1;
    function speakNext() {
      if (cancelled) return;
      qi++;
      var lines = document.querySelectorAll(".factLine");
      for (var li = 0; li < lines.length; li++) lines[li].classList.remove("active");
      if (qi >= 1 && qi - 1 < p.facts.length) {
        var el = document.getElementById("factLine" + (qi - 1));
        if (el) el.classList.add("active");
      }
      if (qi >= queue.length) { setTimeout(goPlay, 500); return; }
      if (audioOn && window.speechSynthesis) {
        var u = new SpeechSynthesisUtterance(queue[qi]);
        u.lang = "pt-BR"; u.rate = 0.95; u.pitch = 1.05;
        u.onend = speakNext;
        u.onerror = speakNext;
        window.speechSynthesis.speak(u);
      } else {
        setTimeout(speakNext, 1900);
      }
    }
    speakNext();
  }

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  function buildLevelLayout(planetIndex) {
    var worldW = 3200 + planetIndex * 260;
    var collectibles = [];
    var n = 0;
    for (var xp = 220; xp < worldW - 200; xp += 330) {
      n++;
      collectibles.push({ id: "c" + n, x: xp, y: n % 2 === 0 ? GROUND_Y - 72 : GROUND_Y - 6, got: false });
    }
    var facts = PLANETS[planetIndex].signFacts;
    var signs = [];
    var signGap = Math.floor(worldW / (facts.length + 1));
    for (var i = 0; i < facts.length; i++) {
      signs.push({ id: "s" + i, x: signGap * (i + 1), fact: facts[i] });
    }
    var aliens = [];
    var ai = 0;
    for (var xp2 = 620; xp2 < worldW - 260; xp2 += 640) {
      aliens.push({ id: "a" + ai, left: xp2, right: xp2 + 170, x: xp2, dir: 1, phase: 0 });
      ai++;
    }
    return { worldW: worldW, collectibles: collectibles, signs: signs, aliens: aliens };

      var sg1 = S.signs.filter(function (x) { return x.id === near; })[0];
      bubble.textContent = sg1.fact; bubble.style.display = "block";
    } else bubble.style.display = "none";

    S.aliens.forEach(function (a) {
      var nx = a.x + 1.1 * a.dir; var dir = a.dir;
      if (nx > a.right) { nx = a.right; dir = -1; } else if (nx < a.left) { nx = a.left; dir = 1; }
      a.x = nx; a.dir = dir; a.phase += 0.25;
      if (Math.abs(nx - S.px) < 28 && S.py > GROUND_Y - 26) takeHit();
    });

    if (S.giant.hp > 0) {
      var d = S.px - S.giant.x;
      var step = Math.sign(d) * Math.min(S.giantSpeed, Math.abs(d));
      S.giant.x += step; S.giant.phase += 0.18;
      if (Math.abs(S.giant.x - S.px) < 48) takeHit();
    }

    var dragonY = 95;
    if (S.dragon.hp > 0) {
      var d2 = S.px - S.dragon.x;
      var step2 = Math.sign(d2) * Math.min(S.dragonSpeed, Math.abs(d2));
      S.dragon.x += step2; S.dragon.phase += 0.09; S.dragon.facingLeft = d2 < 0;
      dragonY = 95 + Math.sin(S.dragon.phase) * 65;
      if (Math.abs(S.dragon.x - S.px) < 40 && Math.abs(dragonY - S.py) < 40) takeHit();
    }

    var camX = clamp(S.px - VIEW_W / 2, 0, Math.max(0, S.worldW - VIEW_W));
    S.meteors = S.meteors.map(function (m) { return Object.assign({}, m, { y: m.y + m.speed }); }).filter(function (m) { return m.y < GROUND_Y + 30; });
    if (S.frame % 70 === 0) {
      S.meteors.push({
        id: "m" + S.frame, x: camX + 20 + Math.random() * (VIEW_W - 40), y: -20,
        r: 11 + Math.random() * 9, speed: 2.8 + Math.random() * 1.6
      });
    }
    S.meteors.forEach(function (m) {
      if (Math.abs(m.x - S.px) < m.r + 14 && Math.abs(m.y - S.py) < m.r + 44) takeHit();
    });

    S.projectiles = S.projectiles.map(function (p) { return Object.assign({}, p, { x: p.x + p.dir * PROJECTILE_SPEED }); }).filter(function (p) { return p.x > -60 && p.x < S.worldW + 60; });
    S.projectiles = S.projectiles.filter(function (p) {
      var consumed = false;
      S.aliens = S.aliens.filter(function (a) {
        if (!consumed && Math.abs(a.x - p.x) < 22) { consumed = true; return false; }
        return true;
      });
      if (consumed) { playKill(); return false; }
      if (S.giant.hp > 0 && Math.abs(S.giant.x - p.x) < 55) {
        S.giant.hp -= 1; S.giant.hp <= 0 ? playKill() : playHit();
        return false;
      }
      if (S.dragon.hp > 0 && Math.abs(S.dragon.x - p.x) < 45 && Math.abs(dragonY - p.y) < 40) {
        S.dragon.hp -= 1; S.dragon.hp <= 0 ? playKill() : playHit();
        return false;
      }
      return true;
    });

    if (S.collectedCount >= S.collectibles.length && !S.done) { S.done = true; playVictory(); showOverlay(true); }

    render(camX, dragonY);
    if (!S.done && !S.gameOver) rafId = requestAnimationFrame(loop);
  }

  function render(camX, dragonY) {
    var svg = document.getElementById("gameSvg");
    svg.setAttribute("viewBox", camX + " 0 " + VIEW_W + " " + VIEW_H);
    var p = S.planet;
    svg.style.background = "linear-gradient(180deg, " + p.skyTop + " 0%, " + p.skyMid + " 60%, " + p.skyBot + " 100%)";

    var s = '<circle cx="' + (camX + 320) + '" cy="40" r="26" fill="' + p.sun + '" opacity="0.85"/>';
    S.collectibles.forEach(function (c) { if (!c.got) s += '<text x="' + c.x + '" y="' + (c.y + 8) + '" font-size="26" text-anchor="middle">💎</text>'; });
    S.meteors.forEach(function (m) { s += meteorSvg(m.x, m.y, m.r, p.crater); });
    S.aliens.forEach(function (a) { s += alienSvg(a.x, a.phase); });
    if (S.giant.hp > 0) s += giantSvg(S.giant.x, S.giant.phase, S.giant.hp, p.giant, p.id);
    if (S.dragon.hp > 0) s += dragonSvg(S.dragon.x, dragonY, S.dragon.phase, S.dragon.facingLeft, S.dragon.hp, p.dragon);
    S.projectiles.forEach(function (pr) { s += boltSvg(pr.x, pr.y, pr.dir); });
    var hit = Date.now() < S.hitUntil;
    s += playerSvg(S.px, S.py, S.facingLeft, hit, S.legPhase, S.grounded);

    document.getElementById("dynamicLayer").innerHTML = s;
  }

  /* ============ VIEWPORT / RESIZE ============ */
  function updateViewport() {
    var wrap = document.getElementById("gameCanvasWrap");
    var rect = wrap.getBoundingClientRect();
    var aspect = rect.width / rect.height;
    VIEW_W = Math.round(VIEW_H * (aspect || 1.4));
  }
  window.addEventListener("resize", updateViewport);
  window.addEventListener("orientationchange", function () { setTimeout(updateViewport, 200); });

  /* ============ MENU BUILD ============ */
  function buildMenu() {
    var grid = document.getElementById("planetGrid");
    grid.innerHTML = "";
    var unlocked = getUnlockedCount();
    PLANETS.forEach(function (p, i) {
      var isLocked = i >= unlocked;
      var btn = document.createElement("button");
      btn.className = "planetCard" + (isLocked ? " locked" : "");
      btn.style.background = "linear-gradient(160deg, " + p.skyMid + ", " + p.skyTop + ")";
      btn.innerHTML = isLocked
        ? '<span class="num">' + p.num + '</span><span class="lock">🔒</span><span>' + p.name + '</span>'
        : '<span class="num">' + p.num + '</span>' + (i < unlocked - 1 ? '<span class="done">✅</span>' : "") + '<span class="dot" style="background:' + p.accent + '"></span><span>' + p.name + '</span>';
      btn.onclick = function () { if (!isLocked) selectPlanet(i); };
      grid.appendChild(btn);
    });
  }

  /* ============ CONTROLS WIRING ============ */
  function bindHold(el, onDown, onUp) {
    el.addEventListener("pointerdown", function (e) { e.preventDefault(); onDown(); });
    el.addEventListener("pointerup", onUp);
    el.addEventListener("pointerleave", onUp);
    el.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  }
  bindHold(document.getElementById("btnLeft"), function () { keys.left = true; }, function () { keys.left = false; });
  bindHold(document.getElementById("btnRight"), function () { keys.right = true; }, function () { keys.right = false; });
  document.getElementById("btnJump").addEventListener("pointerdown", function (e) { e.preventDefault(); doJump(); });
  document.getElementById("btnShoot").addEventListener("pointerdown", function (e) { e.preventDefault(); fireShot(); });

  window.addEventListener("keydown", function (e) {
    if (!S) return;
    if (["ArrowLeft", "a", "A"].indexOf(e.key) !== -1) keys.left = true;
    if (["ArrowRight", "d", "D"].indexOf(e.key) !== -1) keys.right = true;
    if ([" ", "ArrowUp", "w", "W"].indexOf(e.key) !== -1) doJump();
    if (["x", "X", "Enter"].indexOf(e.key) !== -1) fireShot();
  });
  window.addEventListener("keyup", function (e) {
    if (["ArrowLeft", "a", "A"].indexOf(e.key) !== -1) keys.left = false;
    if (["ArrowRight", "d", "D"].indexOf(e.key) !== -1) keys.right = false;
  });

  document.getElementById("menuBtn").onclick = goToMenu;
  document.getElementById("audioBtn").onclick = function () {
    if (!audioOn) { initAudio(); speak("Vamos explorar!"); }
    audioOn = !audioOn;
    document.getElementById("audioBtn").textContent = audioOn ? "🔊" : "🔇";
  };
  document.getElementById("fsBtn").onclick = function () {
    var el = document.documentElement;
    if (!document.fullscreenElement) {
      (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen || function () {}).call(el);
    } else {
      (document.exitFullscreen || document.webkitExitFullscreen || function () {}).call(document);
    }
  };

  /* ============ INIT ============ */
  buildMenu();
  updateViewport();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker
        .register("./service-worker.js")
        .then(function () {
          console.log("PWA registrado com sucesso!");
        })
        .catch(function (error) {
          console.error("Erro ao registrar o PWA:", error);
        });
    });
  }

})();
</script>
